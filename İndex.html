<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coğrafya Şans Tahtası</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #fff;
      overflow: hidden;
    }
    .topbar {
      position: absolute;
      left: 20px;
      top: 18px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      user-select: none;
    }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      cursor: pointer;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      transition: 0.15s ease;
    }
    #startBtn {
      background: #111;
      color: white;
      padding: 12px 26px;
      font-size: 16px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.12);
    }
    #addBtn {
      background: #f2f2f2;
      color: #111;
      padding: 12px 18px;
      font-size: 15px;
    }
    #adminForm {
      position: absolute;
      right: 20px;
      top: 82px;
      width: 280px;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
      padding: 16px;
      display: none;
      z-index: 30;
    }
    #adminForm.visible {
      display: block;
    }
    #adminForm input, #adminForm select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2px solid #ddd;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 15px;
    }
    #adminForm button {
      background: #111;
      color: white;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
    }
    #board {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 2px, transparent 3px),
        radial-gradient(circle at 40% 40%, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 2px, transparent 3px),
        radial-gradient(circle at 70% 20%, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 2px, transparent 3px),
        white;
      background-size: 120px 120px, 120px 120px, 120px 120px, 100% 100%;
    }
    .student {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      min-width: 170px;
      height: 64px;
      background: white;
      border: 3px solid #111;
      border-radius: 20px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.10);
      user-select: none;
      cursor: grab;
      transition: box-shadow 0.15s ease;
    }
    .student:active { cursor: grabbing; }
    .student:hover { box-shadow: 0 14px 22px rgba(0,0,0,0.14); }
    .student .name {
      font-weight: 900;
      text-align: center;
      font-size: 14px;
      line-height: 1.2;
    }
    .student .badge {
      display: none;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .student.helper {
      border-color: #d9b54a;
      background: #fffef8;
    }
    .student.helper .badge {
      display: inline-flex;
      background: rgba(217,181,74,0.18);
      color: #7a5b00;
    }
    .student.developer {
      border-color: #d4a72b;
      background: #fffaf0;
    }
    .student.developer .badge {
      display: inline-flex;
      background: rgba(244,210,96,0.28);
      color: #7a5d10;
    }
    .student.founder {
      border-color: #6d39c9;
      background: #faf7ff;
    }
    .student.founder .badge {
      display: inline-flex;
      background: rgba(109,57,201,0.12);
      color: #5529ba;
    }
    .student.normal .badge { display: none; }
    .trash {
      position: absolute;
      right: -12px;
      top: -12px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #e63b3b;
      color: white;
      border: none;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(230,59,59,0.30);
    }
    .trash:hover { background: #c52f2f; }
    @media (max-width: 700px) {
      h1 { font-size: 18px; }
      .topbar { left: 14px; right: 14px; top: 12px; }
      #startBtn, #addBtn { padding: 10px 14px; font-size: 13px; }
      #adminForm { width: 220px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <h1 id="title">Coğrafya Şans Tahtası</h1>
      <div class="actions">
        <button id="addBtn">Öğrenci Ekle</button>
        <button id="startBtn">Başla</button>
      </div>
    </div>

    <form id="adminForm">
      <label style="display:block; font-weight:700; margin-bottom:8px;">
        Ad Soyad
        <input id="nameInput" type="text" placeholder="Örnek: Ayşe Yılmaz" />
      </label>

      <label style="display:block; font-weight:700; margin-bottom:8px;">
        Rol
        <select id="roleInput">
          <option value="normal">Öğrenci</option>
          <option value="helper">Yardımcı</option>
          <option value="developer">Geliştirici</option>
          <option value="founder">Kurucu</option>
        </select>
      </label>

      <button type="submit">Ekle</button>
    </form>

    <div id="board"></div>
  </div>
