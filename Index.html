<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coğrafya Şans Tahtası</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    .topbar {
      position: absolute;
      left: 20px;
      top: 18px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      user-select: none;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      cursor: pointer;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      transition: 0.15s ease;
    }

    #startBtn {
      background: #111;
      color: white;
      padding: 12px 26px;
      font-size: 16px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.12);
    }

    #addBtn {
      background: #f2f2f2;
      color: #111;
      padding: 12px 18px;
      font-size: 15px;
    }

    #adminForm {
      position: absolute;
      right: 20px;
      top: 82px;
      width: 280px;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
      padding: 16px;
      display: none;
      z-index: 30;
    }

    #adminForm.visible {
      display: block;
    }

    #adminForm input,
    #adminForm select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2px solid #ddd;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    #adminForm button {
      background: #111;
      color: white;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
    }

    #board {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 2px, transparent 3px),
        radial-gradient(circle at 40% 40%, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 2px, transparent 3px),
        radial-gradient(circle at 70% 20%, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 2px, transparent 3px),
        white;
      background-size: 120px 120px, 120px 120px, 120px 120px, 100% 100%;
    }

    .student {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      min-width: 170px;
      height: 64px;
      background: white;
      border: 3px solid #111;
      border-radius: 20px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.10);
      user-select: none;
      cursor: grab;
      transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.2s ease;
    }

    .student:active {
      cursor: grabbing;
    }

    .student:hover {
      box-shadow: 0 14px 22px rgba(0,0,0,0.14);
    }

    .student.selected {
      transform: scale(1.06);
      box-shadow: 0 0 0 4px rgba(17,17,17,0.08), 0 18px 28px rgba(0,0,0,0.18);
    }

    .student .name {
      font-weight: 900;
      text-align: center;
      font-size: 14px;
      line-height: 1.2;
    }

    .student .badge {
      display: none;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .student.helper {
      border-color: #d9b54a;
      background: #fffef8;
    }

    .student.helper .badge {
      display: inline-flex;
      background: rgba(217,181,74,0.18);
      color: #7a5b00;
    }

    .student.developer {
      border-color: #d4a72b;
      background: #fffaf0;
    }

    .student.developer .badge {
      display: inline-flex;
      background: rgba(244,210,96,0.28);
      color: #7a5d10;
    }

    .student.founder {
      border-color: #6d39c9;
      background: #faf7ff;
    }

    .student.founder .badge {
      display: inline-flex;
      background: rgba(109,57,201,0.12);
      color: #5529ba;
    }

    .student.normal .badge {
      display: none;
    }

    .trash {
      position: absolute;
      right: -12px;
      top: -12px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #e63b3b;
      color: white;
      border: none;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(230,59,59,0.30);
    }

    .trash:hover {
      background: #c52f2f;
    }

    @media (max-width: 700px) {
      h1 { font-size: 18px; }
      .topbar { left: 14px; right: 14px; top: 12px; }
      #startBtn, #addBtn { padding: 10px 14px; font-size: 13px; }
      #adminForm { width: 220px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <h1 id="title">Coğrafya Şans Tahtası</h1>
      <div class="actions">
        <button id="addBtn" type="button">Öğrenci Ekle</button>
        <button id="startBtn" type="button">Başla</button>
      </div>
    </div>

    <form id="adminForm">
      <label style="display:block; font-weight:700; margin-bottom:8px;">
        Ad Soyad
        <input id="nameInput" type="text" placeholder="Örnek: Ayşe Yılmaz" />
      </label>

      <label style="display:block; font-weight:700; margin-bottom:8px;">
        Rol
        <select id="roleInput">
          <option value="normal">Öğrenci</option>
          <option value="helper">Yardımcı</option>
          <option value="developer">Geliştirici</option>
          <option value="founder">Kurucu</option>
        </select>
      </label>

      <button type="submit">Ekle</button>
    </form>

    <div id="board"></div>
  </div>

  <script>
    const board = document.getElementById("board");
    const addBtn = document.getElementById("addBtn");
    const startBtn = document.getElementById("startBtn");
    const adminForm = document.getElementById("adminForm");
    const nameInput = document.getElementById("nameInput");
    const roleInput = document.getElementById("roleInput");

    const roleLabels = {
      normal: "Öğrenci",
      helper: "Yardımcı",
      developer: "Geliştirici",
      founder: "Kurucu"
    };

    let draggedStudent = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getRandomPosition(studentEl) {
      const boardRect = board.getBoundingClientRect();
      const width = studentEl.offsetWidth || 170;
      const height = studentEl.offsetHeight || 64;

      const maxX = Math.max(boardRect.width - width - 10, 10);
      const maxY = Math.max(boardRect.height - height - 10, 10);

      return {
        left: Math.random() * maxX,
        top: Math.random() * maxY
      };
    }

    function makeStudentElement(name, role) {
      const student = document.createElement("div");
      student.className = `student ${role}`;
      student.dataset.role = role;
      student.dataset.name = name;

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = roleLabels[role] || "Öğrenci";

      const nameNode = document.createElement("span");
      nameNode.className = "name";
      nameNode.textContent = name;

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "trash";
      removeBtn.textContent = "×";
      removeBtn.setAttribute("aria-label", `${name} öğrencisini sil`);

      student.appendChild(badge);
      student.appendChild(nameNode);
      student.appendChild(removeBtn);

      const position = getRandomPosition(student);
      student.style.left = `${position.left}px`;
      student.style.top = `${position.top}px`;

      removeBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        student.remove();
      });

      student.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".trash")) return;

        draggedStudent = student;
        const rect = student.getBoundingClientRect();
        const boardRect = board.getBoundingClientRect();

        dragOffsetX = event.clientX - rect.left;
        dragOffsetY = event.clientY - rect.top;

        student.setPointerCapture(event.pointerId);
        student.style.zIndex = "15";

        const students = document.querySelectorAll(".student");
        students.forEach((item) => {
          if (item !== student) item.style.zIndex = "1";
        });

        const existingSelected = document.querySelector(".student.selected");
        if (existingSelected && existingSelected !== student) {
          existingSelected.classList.remove("selected");
        }
        student.classList.add("selected");
      });

      student.addEventListener("pointermove", (event) => {
        if (draggedStudent !== student) return;

        const boardRect = board.getBoundingClientRect();
        const width = student.offsetWidth;
        const height = student.offsetHeight;

        const nextLeft = clamp(event.clientX - boardRect.left - dragOffsetX, 0, boardRect.width - width);
        const nextTop = clamp(event.clientY - boardRect.top - dragOffsetY, 0, boardRect.height - height);

        student.style.left = `${nextLeft}px`;
        student.style.top = `${nextTop}px`;
      });

      student.addEventListener("pointerup", () => {
        if (draggedStudent === student) {
          draggedStudent = null;
          student.releasePointerCapture?.();
        }
      });

      student.addEventListener("pointerleave", () => {
        if (draggedStudent === student) {
          draggedStudent = null;
        }
      });

      return student;
    }

    addBtn.addEventListener("click", () => {
      adminForm.classList.toggle("visible");
      if (adminForm.classList.contains("visible")) {
        nameInput.focus();
      }
    });

    adminForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const role = roleInput.value;

      if (!name) {
        nameInput.focus();
        return;
      }

      const student = makeStudentElement(name, role);
      board.appendChild(student);

      nameInput.value = "";
      roleInput.value = "normal";
      adminForm.classList.remove("visible");
    });

    startBtn.addEventListener("click", () => {
      const students = [...document.querySelectorAll(".student")];

      if (!students.length) {
        alert("Önce en az bir öğrenci ekleyin.");
        return;
      }

      students.forEach((student) => student.classList.remove("selected"));

      const chosen = students[Math.floor(Math.random() * students.length)];
      chosen.classList.add("selected");

      const chosenName = chosen.dataset.name;
      const roleName = roleLabels[chosen.dataset.role] || "Öğrenci";
      alert(`${chosenName} (${roleName}) seçildi!`);
    });

    document.addEventListener("click", (event) => {
      if (!adminForm.contains(event.target) && !addBtn.contains(event.target)) {
        adminForm.classList.remove("visible");
      }
    });
  </script>
</body>
</html>
